name: Bug report
description: Report reproducible behavior in The Wizard's Pick.
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, target data, command output, or undisclosed vulnerabilities.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Describe what happened and include a minimal reproduction.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the operating system and Python version.
    validations:
      required: true
  - type: checkboxes
    id: safe
    attributes:
      label: Data check
      options:
        - label: I removed sensitive assessment data and this is not an undisclosed vulnerability.
          required: true
