[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wizards-pick"
description = "Local-first terminal chat assistant for authorized security testing."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Isaac Limb" }]
dynamic = ["version"]
dependencies = [
  "rich>=13.7.0",
]

[project.urls]
Repository = "https://github.com/wizards-ecosystem/wizards-pick"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
]

[project.scripts]
wizards-pick = "wizards_pick.cli:main"

[tool.hatch.version]
path = "src/wizards_pick/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wizards_pick"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
# ruff format owns line width; long data/prompt strings stay readable unwrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
packages = ["wizards_pick"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
