[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "wizards-pick"
description = "Local-first terminal chat assistant for authorized security testing."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac Limb" }]
dynamic = ["version"]
keywords = ["authorized-security-testing", "ollama", "pentesting", "terminal"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]
dependencies = [
  "rich>=13.7.0",
]

[project.urls]
Homepage = "https://github.com/wizards-ecosystem/wizards-pick"
Repository = "https://github.com/wizards-ecosystem/wizards-pick"
Issues = "https://github.com/wizards-ecosystem/wizards-pick/issues"
Security = "https://github.com/wizards-ecosystem/wizards-pick/security/policy"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2.2",
  "twine>=6.1",
]
rope = [
  "gguf>=0.17",
]

[project.scripts]
wizards-pick = "wizards_pick.cli:main"

[tool.hatch.version]
path = "src/wizards_pick/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wizards_pick"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs",
  "/LICENSE",
  "/README.md",
  "/CONTRIBUTING.md",
  "/SECURITY.md",
  "/RELEASING.md",
  "/CHANGELOG.md",
  "/Makefile",
  "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes
  "W",    # pycodestyle warnings
  "I",    # isort
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
]
# ruff format owns line width; long data/prompt strings stay readable unwrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
packages = ["wizards_pick"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
ignore_missing_imports = true
